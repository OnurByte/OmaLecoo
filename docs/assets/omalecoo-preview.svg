  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0c11"/>
      <stop offset="0.55" stop-color="#0e111a"/>
      <stop offset="1" stop-color="#141826"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.22" cy="0.78" r="0.55">
