[package]
name = "omalecoo"
version = "1.5.0"
edition = "2021"
description = "OmaLecoo — Lecoo GK301 keyboard RGB control for Omarchy (hidraw, report ID 7)"
license = "MIT"

[lib]
name = "omalecoo"
path = "src/lib.rs"

[dependencies]
serde_json = "1"

# The installed binary keeps the historical name so the running Quickshell
# plugin and the user's state directory stay valid across updates.
[[bin]]
name = "lecoo-gk301"
path = "src/main.rs"

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
